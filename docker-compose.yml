version: "3.9"

services:
  nextjs-app:
    build: .
    container_name: nextjs-feed-platform
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      SANCTUM_CSRF_API_URL: http://localhost:8000
    stdin_open: true
    tty: true